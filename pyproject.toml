[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chapar"
version = "0.1.0"
description = "Smart CLI tool for project management with GitHub and Telegram integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Miwli" }
]

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Miwli/Chapar"
Repository = "https://github.com/Miwli/Chapar"
Issues = "https://github.com/Miwli/Chapar/issues"

[project.scripts]
chapar = "chapar.cli.main:app"